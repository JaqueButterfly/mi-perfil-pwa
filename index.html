
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body 
        {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .avatar 
        {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid #007bff;
        }
        .btn
        {
            display: block;
            background-color: #007bff; 
            color: white;
            padding: 15px;
            margin: 15px auto;
            border-radius: 25px;
            text-decoration: none;
            width: 80px; max-width: 300px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <img src="img/foto_prueba.jpeg" class="avatar" alt="foto">
    <h1>Diana Jaqueline Aparicio Leon</h1>
    <p>Estudiante de Ingeniería en Desarrollo de Software | Futuro Dev</p>
    <a href="https://www.instagram.com/diana_aparicio_leon/" class="btn">Mi Instagram</a>
    <a href="https://github.com/JaqueButterfly/" class="btn">Mi GitHub</a>


    <script>
        // Comprobamos si el navegador soporta Service Workers
        if ("serviceWorker" in navigator) {

            // Registramos nuestro Service Worker
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => {
                    console.log("Service Worker registrado correctamente");
                })
                .catch((error) => {
                    console.log("Error al registrar Service Worker:", error);
                });
        }
    </script>

</body>
</html>
